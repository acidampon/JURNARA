name: JURNARA Web Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurnara-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture dependency security audit
        run: npm audit --json > npm-audit.json || true
      - name: Block high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: jurnara-dependency-audit-and-lock
          path: |
            npm-audit.json
            package-lock.json
          retention-days: 7
      - name: Refresh live job feed when public sources are available
        run: npm run jobs:fetch
        continue-on-error: true
      - name: Build production site
        run: npm run build
        env:
          GITHUB_PAGES: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: jurnara-web-dist
          path: dist/
          retention-days: 7
