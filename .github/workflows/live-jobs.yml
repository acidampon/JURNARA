name: JURNARA Live Job Feed and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/live-jobs.yml'
      - 'scripts/fetch-jobs.mjs'
      - 'public/opportunities.json'
      - 'package.json'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jurnara-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public job-board feeds
        run: npm run jobs:fetch
      - id: feed
        name: Commit feed only when it changes
        run: |
          if git diff --quiet -- public/opportunities.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Job feed has no changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/opportunities.json
            git commit -m "data: refresh live job opportunities"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.feed.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Install dependencies
        if: steps.feed.outputs.changed == 'true'
        run: npm install --no-audit --no-fund
      - name: Build updated site
        if: steps.feed.outputs.changed == 'true'
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - if: steps.feed.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        if: steps.feed.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
