name: JURNARA Live Job Feed

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/live-jobs.yml'
      - 'scripts/fetch-jobs.mjs'
      - 'public/opportunities.json'
      - 'package.json'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jurnara-live-jobs-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and commit feed without overwriting concurrent changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run jobs:fetch

            if git diff --quiet -- public/opportunities.json; then
              echo "Job feed has no changes."
              exit 0
            fi

            git add public/opportunities.json
            git commit -m "data: refresh live job opportunities"
            if git push origin HEAD:main; then
              echo "Job feed committed successfully."
              exit 0
            fi

            echo "Push raced with another main-branch update; retrying from latest main (attempt $attempt/3)."
            sleep 2
          done

          echo "Could not safely update the job feed after three attempts." >&2
          exit 1
