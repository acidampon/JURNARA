name: JURNARA Live Job Feed

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/live-jobs.yml'
      - 'scripts/fetch-jobs.mjs'
      - 'public/opportunities.json'
      - 'package.json'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jurnara-live-jobs-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public job-board feeds
        run: npm run jobs:fetch
      - name: Commit feed only when it changes
        run: |
          if git diff --quiet -- public/opportunities.json; then
            echo "Job feed has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/opportunities.json
          git commit -m "data: refresh live job opportunities"
          git push
